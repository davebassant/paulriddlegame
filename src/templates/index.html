{% extends "base.html" %}

{% block content %}
<h1>Welcome to the Riddle Game!</h1>
<p>Test your wits across 20 levels of riddles.</p>

<div id="join-game">
    <form hx-post="/join" hx-target="#main-content">
        <label for="player_name">Enter your name (max 12 alphanumeric):</label>
        <input type="text" id="player_name" name="player_name" maxlength="12" pattern="[a-zA-Z0-9]+" required>
        <button type="submit">Start Game</button>
    </form>
</div>
{% endblock %}
